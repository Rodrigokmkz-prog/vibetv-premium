[build]
  publish = "."
  functions = "api"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/megacine/*"
  to = "/.netlify/functions/proxy?url=https://megacine.media/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
